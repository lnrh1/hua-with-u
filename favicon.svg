<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="令你入画">
  <title>令你入画</title>
  <defs>
    <linearGradient id="mz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cf7"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：与站点卡片同一套圆角语言 -->
  <rect width="32" height="32" rx="8.5" fill="url(#mz)"/>

  <!-- 点阵：呼应首页会呼吸、会被鼠标推开的粒子背景 -->
  <g fill="#ffffff">
    <circle cx="9.6"  cy="9.6"  r="1.7" opacity=".5"/>
    <circle cx="22.4" cy="9.6"  r="1.7" opacity=".5"/>
    <circle cx="9.6"  cy="22.4" r="1.7" opacity=".5"/>
    <circle cx="22.4" cy="22.4" r="1.7" opacity=".5"/>

    <circle cx="16"   cy="9.6"  r="2"   opacity=".8"/>
    <circle cx="16"   cy="22.4" r="2"   opacity=".8"/>
    <circle cx="9.6"  cy="16"   r="2"   opacity=".8"/>
    <circle cx="22.4" cy="16"   r="2"   opacity=".8"/>

    <circle cx="16"   cy="16"   r="3.1"/>
  </g>
</svg>
