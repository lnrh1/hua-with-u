name: 自动更新数据

# 三个触发方式：
#   1. push 时：如果改了 mp3（或脚本），自动重算歌单
#   2. 定时：每天刷新一次追番/追剧
#   3. 手动：在 Actions 页面点 Run workflow
on:
  push:
    paths:
      - '*.mp3'
      - 'tools/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '0 2 * * *'      # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:

# 需要写权限才能把生成的数据提交回去
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ubuntu runner 自带 Chrome，tools/browser.mjs 会直接找到它
      - name: 确认浏览器可用
        run: |
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true
          google-chrome --version || chromium --version || true

      - name: 更新歌单（扫描 mp3、解码生成波形）
        run: node tools/update-music.mjs

      - name: 更新追番 / 追剧
        run: node tools/update-bangumi.mjs
        continue-on-error: true    # B 站偶发风控不应让整个流程失败

      - name: 提交变化
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-data.js bangumi-data.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新歌单与追番数据"
            git push
          fi
